defaults:
  - .@train_datasets.gw: GW
  - augmentation@train_datasets.gw.img_transform: default

  - .@val_datasets.gw: GW

  - .@test_datasets.gw: GW

  - _self_

_target_: data.DataModule

train_datasets:
  gw:
    shuffle: True
    splits: [train]
val_datasets:
  gw:
    splits: [val]
test_datasets:
  gw:
    splits: [test]
