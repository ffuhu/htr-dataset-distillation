defaults:
  - augmentation@img_transform: no_aug
  - prep@prepare_data: htr_lines

  - _self_

_target_: data.TranscriptionCTC.HFCTC

collate_fn:
  _target_: data.TranscriptionCTC.collate_fn
  _partial_: True

root: parquet
data_files:
  train: datasets/READ2016/parquet/train.parquet
  val: datasets/READ2016/parquet/val.parquet
  test: datasets/READ2016/parquet/test.parquet

splits: ???

initial_symbols: {<PAD>: 0, <CTC>: 1}
special_symbols: [<PAD>, <CTC>]

map_fn_kwargs:
  fixed_height: 64
  tokenize: True

shuffle: False # Set to true on training split
num_workers: 8
persistent_workers: False
batch_size: ${batch_size}

stats_file: READ2016/${.splits[0]}
vocabulary_file: READ2016/${.splits[0]}
