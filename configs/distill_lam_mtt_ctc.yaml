defaults:
  - data@real_dataset: LAM
  - models@inner_model: CRNN_CTC_reduced_wr8
  - loss_functions@loss_function: CTCLoss

  - _self_

# --- MTT-CTC on LAM (same implementation as distill_iam_mtt_ctc_wr8.yaml /
# distill_read2016_mtt_ctc.yaml, hyperparameters not re-tuned). Includes the
# numerical-stability fix (skip-on-nonfinite + clip_grad_norm_ + inner_lr clamp) found on
# GW. ---
real_dataset:
  splits: [train]
  shuffle: True

channels: 1
batch_size: ${K}

max_h: ???
max_w: ???
max_l: ???

t2i: ???
i2t: ???
vocabulary_size: ???

# --- Expert trajectory buffer (train_expert_lam_wr8.yaml + callbacks.ExpertSnapshotter,
# trained on the FULL LAM pool -- 19829 lines). Generate it first with
# slurm/lanzar_mtt_experts_lam.sbatch. ---
expert_dir: ???

K: 100  # default; the launchers pass K
cluster_file: null  # random init, same criterion as DC/DM on LAM

# The LAM wr8 full-pool model converged around epoch ~124, stopped by patience at
# ~149 -- max_start_epoch covers the early half, same criterion as
# IAM/GW/READ2016.
max_start_epoch: 40

expert_epochs_ahead: 1

outer_iterations: 2000
inner_steps: 20
inner_batch_size: 8  # same criterion as the others: = actual batch_size of train_expert_lam_wr8.yaml

pixel_lr: 0.1
mtt_inner_lr_init: 0.01
mtt_inner_lr_lr: 1.0e-3
mtt_inner_lr_max: 0.1  # upper bound of inner_lr (null = no bound, as in the original MTT; E13)

log_every: 10

seed: 42

buffer_path: outputs/distill/lam_mtt_ctc.pt
