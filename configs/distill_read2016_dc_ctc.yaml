defaults:
  - data@real_dataset: READ2016
  - models@inner_model: CRNN_CTC_reduced_wr8
  - loss_functions@loss_function: CTCLoss

  - _self_

# --- DC-CTC on READ2016. Full training pool (8366 lines). ---
real_dataset:
  splits: [train]
  shuffle: True
  filter_func:
    _target_: data.huggingface.forbid_indices
    _partial_: true
    forbidden_indices: ${load:data/READ2016/infeasible_wr8_indices.yaml}

channels: 1
batch_size: ${matching_batch_size}

max_h: ???
max_w: ???
max_l: ???

t2i: ???
i2t: ???
vocabulary_size: ???

K: 100  # default; the launchers pass K

cluster_file: null
outer_iterations: 2000
matching_batch_size: 32

inner_steps_every_n: 10
inner_steps_count: 5

reinit_every_n: 200

syn_lr: 0.1
inner_lr: 1.0e-3

log_every: 50

seed: 42

buffer_path: outputs/distill/read2016_dc_ctc.pt
