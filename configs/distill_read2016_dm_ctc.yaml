defaults:
  - data@real_dataset: READ2016
  - models@embedding_encoder: CNN_reduced

  - _self_

real_dataset:
  splits: [train]
  shuffle: True
  filter_func:
    _target_: data.huggingface.forbid_indices
    _partial_: true
    forbidden_indices: ${load:data/READ2016/infeasible_wr8_indices.yaml}

channels: 1
batch_size: ${matching_batch_size}

embedding_encoder:
  in_channels: ${channels}

encoder_source: random
teacher_ckpt: null

dsa: false
dsa_rotation_degrees: 3.0
dsa_translation: 0.05
dsa_chance: 0.2

K: 100

cluster_file: null
outer_iterations: 2000
matching_batch_size: 32

pooling: mean
encoder_resample_every: 20

syn_lr: 0.1

log_every: 50
seed: 42

buffer_path: outputs/distill/read2016_dm_ctc.pt
