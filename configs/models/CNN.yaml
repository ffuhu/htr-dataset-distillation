defaults:
  - _self_

_target_: models.others.CNN

width_reduction: 4
height_reduction: 16
in_channels: ???
out_channels: ${.modules.layers._args_.12.out_channels}

modules:
  layers:
    _target_: torch.nn.Sequential
    _args_:
      #### Block 0 ####
      - _target_: torch.nn.Conv2d
        bias: false
        in_channels: ${.....in_channels}
        kernel_size: 5
        out_channels: 64
        padding: same

      - _target_: torch.nn.BatchNorm2d
        num_features: ${..0.out_channels}

      - _target_: torch.nn.LeakyReLU
        inplace: true
        negative_slope: 0.2

      - _target_: torch.nn.MaxPool2d
        kernel_size: [2, 2]

      #### Block 1 ####
      - _target_: torch.nn.Conv2d
        bias: false
        in_channels: ${..0.out_channels}
        kernel_size: 5
        out_channels: 64
        padding: same

      - _target_: torch.nn.BatchNorm2d
        num_features: ${..4.out_channels}

      - _target_: torch.nn.LeakyReLU
        inplace: true
        negative_slope: 0.2

      - _target_: torch.nn.MaxPool2d
        kernel_size: [2, 2]

      #### Block 2 ####
      - _target_: torch.nn.Conv2d
        bias: false
        in_channels: ${..4.out_channels}
        kernel_size: 5
        out_channels: 64
        padding: same

      - _target_: torch.nn.BatchNorm2d
        num_features: ${..8.out_channels}

      - _target_: torch.nn.LeakyReLU
        inplace: true
        negative_slope: 0.2

      - _target_: torch.nn.MaxPool2d
        kernel_size: [2, 1]

      #### Block 3 ####
      - _target_: torch.nn.Conv2d
        bias: false
        in_channels: ${..8.out_channels}
        kernel_size: 5
        out_channels: 64
        padding: same

      - _target_: torch.nn.BatchNorm2d
        num_features: ${..12.out_channels}

      - _target_: torch.nn.LeakyReLU
        inplace: true
        negative_slope: 0.2

      - _target_: torch.nn.MaxPool2d
        kernel_size: [2, 1]
