defaults:
  - _self_

_target_: models.others.CNN
_convert_: all

# Halfway point between CNN_reduced (width_reduction=4, where distillation matching converges
# but from-scratch training on tiny K crawls inside the dominant-character attractor) and a
# width_reduction=16 variant (where training learns but 83/500 pool lines are CTC-infeasible
# and matching barely progresses). width_reduction=8 kept every line of a 500-line diagnostic
# IAM pool feasible (min margin +2, src/check_ctc_feasibility.py) while halving T relative to
# CNN_reduced.
width_reduction: 8
height_reduction: 16
in_channels: ???
out_channels: ${.modules.layers._args_.12.out_channels}

modules:
  layers:
    _target_: torch.nn.Sequential
    _args_:
      #### Block 0 ####
      - _target_: torch.nn.Conv2d
        bias: false
        in_channels: ${.....in_channels}
        kernel_size: 5
        out_channels: 32
        padding: same

      - _target_: torch.nn.BatchNorm2d
        num_features: ${..0.out_channels}

      - _target_: torch.nn.LeakyReLU
        inplace: true
        negative_slope: 0.2

      - _target_: torch.nn.MaxPool2d
        kernel_size: [2, 2]

      #### Block 1 ####
      - _target_: torch.nn.Conv2d
        bias: false
        in_channels: ${..0.out_channels}
        kernel_size: 5
        out_channels: 32
        padding: same

      - _target_: torch.nn.BatchNorm2d
        num_features: ${..4.out_channels}

      - _target_: torch.nn.LeakyReLU
        inplace: true
        negative_slope: 0.2

      - _target_: torch.nn.MaxPool2d
        kernel_size: [2, 2]

      #### Block 2 (kernel [2,2] instead of [2,1] in CNN_reduced.yaml: also halves width) ####
      - _target_: torch.nn.Conv2d
        bias: false
        in_channels: ${..4.out_channels}
        kernel_size: 5
        out_channels: 32
        padding: same

      - _target_: torch.nn.BatchNorm2d
        num_features: ${..8.out_channels}

      - _target_: torch.nn.LeakyReLU
        inplace: true
        negative_slope: 0.2

      - _target_: torch.nn.MaxPool2d
        kernel_size: [2, 2]

      #### Block 3 (kept [2,1] as in CNN_reduced.yaml) ####
      - _target_: torch.nn.Conv2d
        bias: false
        in_channels: ${..8.out_channels}
        kernel_size: 5
        out_channels: 32
        padding: same

      - _target_: torch.nn.BatchNorm2d
        num_features: ${..12.out_channels}

      - _target_: torch.nn.LeakyReLU
        inplace: true
        negative_slope: 0.2

      - _target_: torch.nn.MaxPool2d
        kernel_size: [2, 1]
