defaults:
  - data@data_module: READ2016DM

  - models@model_wrapper: CRNN_CTC_Wrapper_reduced_wr8

  - loss_functions@loss_function: CTCLoss
  - optimizers@optimizer: Adam

  - trainer@trainer: default
  - trainer@trainer_callbacks.checkpointer: checkpointer
  - trainer@trainer_callbacks.early_stopping: early_stopping

  - logger@trainer.logger: wandb

  - _self_

# MTT: trains ONE expert trajectory on the full READ2016 pool (8354 feasible training lines,
# see infeasible_wr8_indices.yaml via READ2016DM), saving a snapshot of the parameters after
# every epoch via callbacks.ExpertSnapshotter. EXACTLY the same recipe as the READ2016 wr8
# full-pool model (read2016_default + wr8, no lr/epoch overrides) -- that model converged at
# epoch ~79 (val SER 15.37), stopped by patience at 84.
#
# `seed` and `trainer_callbacks.expert_snapshotter.dirpath` are passed on the command line,
# one per trajectory (see slurm/lanzar_mtt_experts_read2016.sbatch).

source_name: scratch
dataset_name: read2016_expert_trajectory

validation_set: val

experiment_id: CRNN_CTC-${source_name}-${dataset_name}_${validation_set}
run_name: CRNN_CTC ${source_name} -> ${dataset_name} (${validation_set})

max_h: ???
max_w: ???
max_l: ???

t2i: ???
i2t: ???
vocabulary_size: ???

channels: 1
batch_size: 8
train: True

seed: ???
weights: ???
from_checkpoint: ???
checkpoint_after_training: ???

extra:
  _target_: extras.default
  _partial_: True

trainer:
  min_epochs: 0
  max_epochs: 10000
  min_steps: 0
  check_val_every_n_epoch: 5
  logger:
    name: ${run_name}

trainer_callbacks:
  checkpointer:
    filename: ${experiment_id}
  expert_snapshotter:
    _target_: callbacks.ExpertSnapshotter
    dirpath: ???
    every_n_epochs: 1
    max_epoch: null  # optional cap to avoid saving epochs MTT never reads (see callbacks.ExpertSnapshotter)
